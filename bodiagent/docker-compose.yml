# Production-like docker-compose for repeatable P0 infra verification.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bodiagent}
      POSTGRES_USER: ${POSTGRES_USER:-bodiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodiagent}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT_HOST:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: bodiagent.settings_prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-compose-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-bodiagent}
      POSTGRES_USER: ${POSTGRES_USER:-bodiagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodiagent}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@bodiagentteam.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      DJANGO_MIGRATE_ON_START: ${DJANGO_MIGRATE_ON_START:-1}
      DJANGO_COLLECTSTATIC_ON_START: ${DJANGO_COLLECTSTATIC_ON_START:-1}
      BODIAGENT_BOOTSTRAP_ADMIN_EMAIL: ${BODIAGENT_BOOTSTRAP_ADMIN_EMAIL:-}
      BODIAGENT_BOOTSTRAP_ADMIN_PASSWORD: ${BODIAGENT_BOOTSTRAP_ADMIN_PASSWORD:-}
      BODIAGENT_BOOTSTRAP_ADMIN_NAME: ${BODIAGENT_BOOTSTRAP_ADMIN_NAME:-admin}
      BODIAGENT_BOOTSTRAP_ADMIN_UPDATE_PASSWORD: ${BODIAGENT_BOOTSTRAP_ADMIN_UPDATE_PASSWORD:-1}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    profiles: ["daemon"]
    environment:
      BODIAGENT_SERVER_URL: ${BODIAGENT_SERVER_URL:-http://web:8000}
      BODIAGENT_TOKEN: ${BODIAGENT_TOKEN:-}
      BODIAGENT_WORKSPACE_ID: ${BODIAGENT_WORKSPACE_ID:-}
    volumes:
      - daemon-home:/home/bodiagent/.bodiagent
    depends_on:
      web:
        condition: service_healthy
    command: ["status"]

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
  daemon-home:
