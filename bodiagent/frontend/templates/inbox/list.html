{% extends "base.html" %}
{% block title %}收件箱 - 波笛智能体{% endblock %}

{% block content %}
<div data-workspace-id="{{ current_workspace_id|default:'' }}" data-csrf="{{ csrf_token }}">
<div class="max-w-3xl mx-auto">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">收件箱</h1>
      <p class="mt-1 text-sm text-gray-500">通知和动态更新</p>
    </div>
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
      <span id="inbox-unread-count" class="rounded-full bg-blue-50 px-3 py-1 text-sm font-medium text-blue-700">0</span>
      <button id="inbox-mark-all-read" type="button" class="rounded-md border border-gray-200 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">
        全部已读
      </button>
      <button id="inbox-archive-read" type="button" class="rounded-md border border-gray-200 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">
        归档已读
      </button>
    </div>
  </div>

  <!-- Inbox List -->
  <div id="inbox-list" class="space-y-3">
    <div class="text-center py-12 text-sm text-gray-400">
      加载中<span class="htmx-indicator">...</span>
    </div>
  </div>

  <!-- Load More -->
  <div class="mt-4 text-center">
    <button id="inbox-load-more" type="button" class="hidden rounded-md border border-gray-200 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">加载更多</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var root = document.querySelector('[data-workspace-id]');
  var workspaceId = root ? root.dataset.workspaceId || '' : '';
  var csrfToken = root ? root.dataset.csrf || '' : '';
  var state = { offset: 0, limit: 20, total: 0, items: [] };
  var list = document.getElementById('inbox-list');
  var unread = document.getElementById('inbox-unread-count');
  var loadMore = document.getElementById('inbox-load-more');

  function headers(hasBody) {
    var result = { 'Accept': 'application/json', 'X-CSRFToken': csrfToken };
    if (workspaceId) result['X-Workspace-ID'] = workspaceId;
    if (hasBody) result['Content-Type'] = 'application/json';
    return result;
  }

  async function apiJson(url, options) {
    var opts = options || {};
    opts.headers = Object.assign(headers(Boolean(opts.body)), opts.headers || {});
    opts.credentials = 'same-origin';
    var response = await fetch(url, opts);
    var text = await response.text();
    var data = text ? JSON.parse(text) : {};
    if (!response.ok) throw new Error(formatApiError(data) || ('HTTP ' + response.status));
    return data;
  }

  function normalizeList(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.items)) return data.items;
    if (Array.isArray(data.results)) return data.results;
    return [];
  }

  function formatApiError(data) {
    if (!data) return '';
    if (typeof data === 'string') return data;
    if (data.detail) return data.detail;
    return Object.keys(data).map(function(key) { return key + ': ' + data[key]; }).join('; ');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function getTypeLabel(type) {
    var map = {
      issue_assigned: '分配给我', unassigned: '取消分配', assignee_changed: '负责人变更', status_changed: '状态变更',
      priority_changed: '优先级变更', due_date_changed: '截止日期变更', new_comment: '新评论', mentioned: '提及了我',
      review_requested: '请求审查', task_completed: '任务完成', task_failed: '任务失败', agent_blocked: '智能体阻塞',
      agent_completed: '智能体完成', reaction_added: '新回应', quick_create_done: '快速创建完成', quick_create_failed: '快速创建失败'
    };
    return map[type] || type || '通知';
  }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    return d.toLocaleDateString('zh-CN', {month:'short', day:'numeric'});
  }

  function updateUnread() {
    var count = state.items.filter(function(item) { return !item.read; }).length;
    unread.textContent = String(count);
  }

  function renderInbox() {
    updateUnread();
    if (!state.items.length) {
      list.innerHTML = '<div class="text-center py-12 text-sm text-gray-400">收件箱为空</div>';
      loadMore.classList.add('hidden');
      return;
    }
    list.innerHTML = state.items.map(function(item) {
      var isUnread = !item.read;
      var bg = isUnread ? 'bg-blue-50' : 'bg-white';
      var dot = isUnread ? 'bg-blue-500' : 'bg-gray-200';
      var issueLink = item.issue_id ? '/issues/' + item.issue_id + '/' : '#';
      var severityClass = item.severity === 'critical' ? 'text-red-600' : item.severity === 'warning' ? 'text-yellow-600' : 'text-blue-600';
      return '<a href="' + escapeHtml(issueLink) + '" data-inbox-id="' + escapeHtml(item.id) + '" class="inbox-item flex items-start gap-3 rounded-lg border border-gray-200 ' + bg + ' p-4 shadow-sm transition-shadow hover:shadow-md">' +
        '<span class="mt-1 flex h-2 w-2 shrink-0 rounded-full ' + dot + '"></span>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="mb-1 flex items-center gap-2">' +
            '<span class="text-xs font-medium ' + severityClass + '">' + escapeHtml(getTypeLabel(item.type)) + '</span>' +
            '<span class="text-xs text-gray-400">' + escapeHtml(formatDate(item.created_at)) + '</span>' +
          '</div>' +
          '<p class="truncate text-sm font-medium text-gray-900">' + escapeHtml(item.title || '') + '</p>' +
          (item.body ? '<p class="mt-1 line-clamp-2 text-sm text-gray-500">' + escapeHtml(item.body) + '</p>' : '') +
        '</div>' +
      '</a>';
    }).join('');
    if (state.items.length < state.total) loadMore.classList.remove('hidden');
    else loadMore.classList.add('hidden');
  }

  async function loadInbox(reset) {
    if (reset) {
      state.offset = 0;
      list.innerHTML = '<div class="text-center py-12 text-sm text-gray-400">加载中...</div>';
    }
    var data = await apiJson('/api/inbox?offset=' + state.offset + '&limit=' + state.limit);
    var items = normalizeList(data);
    state.total = typeof data.total === 'number' ? data.total : items.length;
    state.items = reset ? items : state.items.concat(items);
    state.offset = state.items.length;
    renderInbox();
  }

  async function refreshInbox() {
    await loadInbox(true);
  }

  async function markRead(id) {
    var data = await apiJson('/api/inbox/' + id + '/read', { method: 'POST' });
    state.items = state.items.map(function(item) { return item.id === id ? data : item; });
    renderInbox();
  }

  list.addEventListener('click', function(event) {
    var row = event.target.closest('.inbox-item');
    if (!row) return;
    var item = state.items.find(function(entry) { return entry.id === row.dataset.inboxId; });
    if (!item || item.read) return;
    event.preventDefault();
    markRead(item.id).finally(function() { window.location.href = row.getAttribute('href') || '/inbox/'; });
  });

  document.getElementById('inbox-mark-all-read').addEventListener('click', async function() {
    await apiJson('/api/inbox/mark-all-read', { method: 'POST' });
    await refreshInbox();
  });

  document.getElementById('inbox-archive-read').addEventListener('click', async function() {
    await apiJson('/api/inbox/archive-all-read', { method: 'POST' });
    await refreshInbox();
  });

  loadMore.addEventListener('click', function() { loadInbox(false).catch(function(error) { list.innerHTML = '<div class="text-center py-12 text-sm text-red-600">加载失败：' + escapeHtml(error.message) + '</div>'; }); });

  if (!workspaceId) {
    list.innerHTML = '<div class="text-center py-12 text-sm text-gray-400">缺少工作区，无法加载收件箱</div>';
    return;
  }
  loadInbox(true).catch(function(error) {
    list.innerHTML = '<div class="text-center py-12 text-sm text-red-600">加载失败：' + escapeHtml(error.message) + '</div>';
  });
})();
</script>
{% endblock %}
