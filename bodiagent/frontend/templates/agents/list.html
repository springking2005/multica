{% extends "base.html" %}
{% block title %}智能体 - 波笛智能体{% endblock %}

{% block content %}
<div class="ba-page-shell" id="agent-page" data-workspace-id="{{ current_workspace_id|default:'' }}" data-csrf="{{ csrf_token }}">
  <header class="ba-page-header">
    <div class="ba-page-heading">
      <div class="ba-page-eyebrow">Agents</div>
      <h1 class="ba-page-title">智能体</h1>
      <p class="ba-page-description">管理工作区内的 AI 智能体、运行时配置和任务并发。</p>
    </div>
    <div class="ba-page-actions">
      <span id="agent-count" class="ba-badge ba-badge--neutral">0 个智能体</span>
      <button type="button" class="ba-button ba-button--primary" onclick="openAgentForm()" data-ba-dialog-open>
        创建智能体
      </button>
    </div>
  </header>

  <div id="agent-alert" class="ba-alert ba-alert--info mb-4 hidden" role="status" aria-live="polite"></div>

  <section class="ba-toolbar" aria-label="智能体筛选工具栏">
    <div class="ba-toolbar-group">
      <label class="sr-only" for="agent-search">搜索智能体</label>
      <input id="agent-search" class="ba-input sm:max-w-xs" type="search" placeholder="搜索名称、描述、提供商或模型" autocomplete="off">
      <label class="sr-only" for="agent-status-filter">状态</label>
      <select id="agent-status-filter" class="ba-select sm:max-w-[10rem]" aria-label="状态筛选">
        <option value="active">活跃</option>
        <option value="archived">已归档</option>
        <option value="all">全部状态</option>
      </select>
      <label class="sr-only" for="agent-sort">排序</label>
      <select id="agent-sort" class="ba-select sm:max-w-[12rem]" aria-label="排序">
        <option value="updated_desc">最近更新</option>
        <option value="created_desc">最近创建</option>
        <option value="name_asc">名称 A-Z</option>
        <option value="provider_asc">提供商 A-Z</option>
      </select>
    </div>
    <div class="ba-toolbar-group sm:flex-none sm:justify-end">
      <button type="button" class="ba-button ba-button--secondary" onclick="resetAgentFilters()">重置</button>
      <button type="button" class="ba-button ba-button--ghost" onclick="loadAgentDependencies()">刷新</button>
    </div>
  </section>

  <div id="agent-surface" class="space-y-3">
    <div class="ba-empty-state">
      <div class="ba-empty-state-icon">…</div>
      <div class="ba-empty-state-title">正在加载智能体</div>
      <div class="ba-empty-state-body">正在读取工作区智能体和 Daemon 状态。</div>
    </div>
  </div>
</div>

<div id="agent-dialog" class="ba-dialog-backdrop hidden" data-ba-dialog hidden role="dialog" aria-modal="true" aria-labelledby="agent-dialog-title" aria-describedby="agent-dialog-description">
  <form id="agent-form" class="ba-dialog-panel ba-dialog-panel--wide" novalidate>
    {% csrf_token %}
    <input type="hidden" name="agent_id" id="agent_id">
    <div class="ba-dialog-header">
      <div>
        <h2 id="agent-dialog-title" class="ba-dialog-title">创建智能体</h2>
        <p id="agent-dialog-description" class="ba-dialog-description">选择 Daemon、模型和执行配置。高级 JSON 会先在浏览器中校验。</p>
      </div>
      <button type="button" class="ba-icon-button" aria-label="关闭" onclick="closeAgentDialog()" data-ba-dialog-close>×</button>
    </div>
    <div class="ba-dialog-body space-y-4">
      <div id="agent-form-error" class="ba-alert ba-alert--error hidden" role="alert"></div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block sm:col-span-2">
          <span class="ba-toolbar-label">名称</span>
          <input type="text" name="name" required class="ba-input mt-1" placeholder="给智能体取个名字">
        </label>
        <label class="block sm:col-span-2">
          <span class="ba-toolbar-label">描述</span>
          <input type="text" name="description" class="ba-input mt-1" placeholder="简短描述这个智能体的用途">
        </label>
        <label class="block">
          <span class="ba-toolbar-label">Daemon</span>
          <select name="daemon_id" id="agent_daemon_id" required class="ba-select mt-1">
            <option value="">请选择 Daemon</option>
          </select>
        </label>
        <label class="block">
          <span class="ba-toolbar-label">提供商</span>
          <select name="provider" required class="ba-select mt-1">
            <option value="claude">Claude</option>
            <option value="codex">Codex</option>
            <option value="gemini">Gemini</option>
            <option value="copilot">Copilot</option>
            <option value="openclaw">OpenClaw</option>
            <option value="opencode">OpenCode</option>
            <option value="hermes">Hermes</option>
            <option value="pi">Pi</option>
            <option value="cursor">Cursor</option>
            <option value="kimi">Kimi</option>
            <option value="kiro">Kiro</option>
          </select>
        </label>
        <label class="block">
          <span class="ba-toolbar-label">模型</span>
          <input type="text" name="model" class="ba-input mt-1" placeholder="如 claude-sonnet-4-20250514">
        </label>
        <label class="block">
          <span class="ba-toolbar-label">最大并发任务</span>
          <input type="number" name="max_concurrent_tasks" min="1" max="20" value="3" class="ba-input mt-1">
        </label>
      </div>
      <label class="block">
        <span class="ba-toolbar-label">指令</span>
        <textarea name="instructions" rows="4" class="ba-textarea mt-1" placeholder="系统指令（可选）"></textarea>
      </label>
      <details class="rounded-xl border border-gray-200 bg-gray-50 p-3">
        <summary class="cursor-pointer text-sm font-semibold text-gray-700">高级 JSON 配置</summary>
        <div class="mt-3 grid grid-cols-1 gap-3">
          <label class="block">
            <span class="ba-toolbar-label">环境变量 JSON</span>
            <textarea name="custom_env" rows="3" class="ba-textarea mt-1 font-mono">{}</textarea>
          </label>
          <label class="block">
            <span class="ba-toolbar-label">启动参数 JSON</span>
            <textarea name="custom_args" rows="3" class="ba-textarea mt-1 font-mono">{}</textarea>
          </label>
          <label class="block">
            <span class="ba-toolbar-label">MCP 配置 JSON</span>
            <textarea name="mcp_config" rows="3" class="ba-textarea mt-1 font-mono">{}</textarea>
          </label>
        </div>
      </details>
    </div>
    <div class="ba-dialog-footer">
      <button type="button" class="ba-button ba-button--secondary" onclick="closeAgentDialog()" data-ba-dialog-close>取消</button>
      <button type="submit" id="agent-submit-button" class="ba-button ba-button--primary">创建</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
var agentState = { agents: [], daemons: [], tasksByAgent: {}, filters: { search: '', status: 'active', sort: 'updated_desc' } };
var agentPage = document.getElementById('agent-page');
var agentWorkspaceId = agentPage ? agentPage.dataset.workspaceId : '';
var agentCsrf = agentPage ? agentPage.dataset.csrf : '';
var agentLastDialogTrigger = null;

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('agent-form').addEventListener('submit', submitAgentForm);
  document.getElementById('agent-search').addEventListener('input', function(event) {
    agentState.filters.search = event.target.value.trim().toLowerCase();
    renderAgents();
  });
  document.getElementById('agent-status-filter').addEventListener('change', function(event) {
    agentState.filters.status = event.target.value;
    renderAgents();
  });
  document.getElementById('agent-sort').addEventListener('change', function(event) {
    agentState.filters.sort = event.target.value;
    renderAgents();
  });
  window.addEventListener('ba:escape', closeAgentDialog);
  loadAgentDependencies();
});

function agentHeaders() {
  return {'Content-Type': 'application/json', 'X-CSRFToken': agentCsrf, 'X-Workspace-ID': agentWorkspaceId};
}

function daemonHeaders() {
  return {'Content-Type': 'application/json', 'X-CSRFToken': agentCsrf, 'X-Workspace-ID': agentWorkspaceId};
}

async function apiJson(url, options) {
  var response = await fetch(url, options || {});
  var text = await response.text();
  var data = text ? JSON.parse(text) : {};
  if (!response.ok) throw new Error(formatApiError(data));
  return data;
}

async function loadAgentDependencies() {
  hideAgentAlert();
  if (!agentWorkspaceId) {
    updateAgentCount(0, 0);
    renderAgentEmpty('缺少工作区', '当前用户还没有工作区，无法加载智能体。', false);
    return;
  }
  renderAgentLoading();
  try {
    var results = await Promise.all([
      apiJson('/api/agents', {headers: agentHeaders()}),
      apiJson('/api/daemons/', {headers: daemonHeaders()})
    ]);
    agentState.agents = normalizeList(results[0]);
    agentState.daemons = normalizeList(results[1]);
    agentState.tasksByAgent = {};
    renderDaemonOptions();
    await loadVisibleAgentTasks();
    renderAgents();
  } catch (error) {
    updateAgentCount(0, 0);
    renderAgentEmpty('加载失败', error.message, false);
  }
}

async function loadVisibleAgentTasks() {
  var activeAgents = agentState.agents.filter(function(agent) { return agent.status !== 'archived'; }).slice(0, 25);
  await Promise.all(activeAgents.map(async function(agent) {
    try {
      agentState.tasksByAgent[agent.id] = normalizeList(await apiJson('/api/agents/' + agent.id + '/tasks', {headers: agentHeaders()}));
    } catch (error) {
      agentState.tasksByAgent[agent.id] = [];
    }
  }));
}

function renderDaemonOptions() {
  var select = document.getElementById('agent_daemon_id');
  var options = '<option value="">请选择 Daemon</option>' + agentState.daemons.map(function(daemon) {
    var label = daemon.device_name || daemon.hostname || daemon.machine_id || daemon.id;
    var state = daemon.status || daemon.state || daemon.last_seen_status || '';
    return '<option value="' + escapeAttr(daemon.id) + '">' + escapeHtml(label + (state ? ' · ' + state : '')) + '</option>';
  }).join('');
  select.innerHTML = options;
}

function renderAgents() {
  var surface = document.getElementById('agent-surface');
  var visible = filteredAgents();
  updateAgentCount(visible.length, agentState.agents.length);
  if (!agentState.daemons.length) {
    renderAgentPrerequisiteEmpty();
    return;
  }
  if (!agentState.agents.length) {
    renderAgentEmpty('暂无智能体', '创建第一个智能体后，可在这里编辑配置、归档、复制配置或取消正在运行的任务。', true);
    return;
  }
  if (!visible.length) {
    renderAgentEmpty('没有匹配的智能体', '调整搜索、状态或排序条件后重试。', false);
    return;
  }
  surface.innerHTML = '<div class="ba-table-wrap">' +
    '<table class="ba-table" aria-label="智能体列表"><thead><tr>' +
      '<th>智能体</th><th>运行时</th><th>状态</th><th>并发</th><th>任务</th><th>更新时间</th><th class="text-right">操作</th>' +
    '</tr></thead><tbody>' + visible.map(renderAgentRow).join('') + '</tbody></table></div>';
}

function renderAgentRow(agent) {
  var daemon = findDaemon(agent.daemon_id);
  var tasks = agentState.tasksByAgent[agent.id] || [];
  var running = tasks.filter(function(task) { return ['queued', 'dispatched', 'running'].indexOf(task.status) !== -1; }).length;
  var canCancel = running > 0;
  var status = agent.status || 'active';
  var actionLabel = status === 'archived' ? '恢复' : '归档';
  return '<tr>' +
    '<td><div class="ba-row-main"><div class="ba-row-title">' + escapeHtml(agent.name || '未命名智能体') + '</div>' +
      '<div class="ba-row-meta">' + escapeHtml(agent.description || '无描述') + '</div></div></td>' +
    '<td><div class="text-sm font-semibold text-gray-800">' + escapeHtml(agent.provider || '未设置') + '</div>' +
      '<div class="ba-row-meta">' + escapeHtml(agent.model || '默认模型') + '</div>' +
      '<div class="ba-row-meta">Daemon: ' + escapeHtml(daemon ? (daemon.device_name || daemon.hostname || daemon.machine_id || daemon.id) : '未绑定') + '</div></td>' +
    '<td>' + statusBadge(status) + '</td>' +
    '<td>' + escapeHtml(agent.max_concurrent_tasks || 3) + '</td>' +
    '<td><span class="ba-badge ' + (running ? 'ba-badge--warning' : 'ba-badge--neutral') + '">' + running + ' 运行中</span></td>' +
    '<td>' + formatDate(agent.updated_at || agent.created_at) + '</td>' +
    '<td><div class="ba-row-actions justify-end">' +
      '<button type="button" class="ba-button ba-button--ghost" onclick="openAgentForm(\'' + escapeJs(agent.id) + '\')" data-ba-dialog-open>编辑</button>' +
      '<button type="button" class="ba-button ba-button--ghost" onclick="copyAgentConfig(\'' + escapeJs(agent.id) + '\')">复制配置</button>' +
      '<button type="button" class="ba-button ba-button--ghost" onclick="toggleAgentArchive(\'' + escapeJs(agent.id) + '\')">' + actionLabel + '</button>' +
      '<button type="button" class="ba-button ba-button--ghost" ' + (canCancel ? '' : 'disabled title="没有正在运行的任务"') + ' onclick="cancelAgentTasks(\'' + escapeJs(agent.id) + '\')">取消任务</button>' +
      '<button type="button" class="ba-button ba-button--danger" onclick="deleteAgent(\'' + escapeJs(agent.id) + '\')">删除</button>' +
    '</div></td>' +
  '</tr>';
}

function filteredAgents() {
  var search = agentState.filters.search;
  var status = agentState.filters.status;
  var visible = agentState.agents.filter(function(agent) {
    var agentStatus = agent.status || 'active';
    if (status !== 'all' && agentStatus !== status) return false;
    if (!search) return true;
    var haystack = [agent.name, agent.description, agent.provider, agent.model, agent.instructions].join(' ').toLowerCase();
    return haystack.indexOf(search) !== -1;
  });
  visible.sort(function(a, b) {
    if (agentState.filters.sort === 'name_asc') return String(a.name || '').localeCompare(String(b.name || ''), 'zh-CN');
    if (agentState.filters.sort === 'provider_asc') return String(a.provider || '').localeCompare(String(b.provider || ''));
    if (agentState.filters.sort === 'created_desc') return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    return String(b.updated_at || b.created_at || '').localeCompare(String(a.updated_at || a.created_at || ''));
  });
  return visible;
}

function renderAgentLoading() {
  document.getElementById('agent-surface').innerHTML = '<div class="ba-empty-state"><div class="ba-empty-state-icon">…</div><div class="ba-empty-state-title">正在加载智能体</div><div class="ba-empty-state-body">正在读取工作区智能体和 Daemon 状态。</div></div>';
}


function renderAgentPrerequisiteEmpty() {
  document.getElementById('agent-surface').innerHTML = '<div class="ba-empty-state">' +
    '<div class="ba-empty-state-icon">⚙</div>' +
    '<div class="ba-empty-state-title">需要先连接 Daemon</div>' +
    '<div class="ba-empty-state-body">创建智能体前需要可用 Daemon/运行时，并在设置中配置对应提供商令牌。</div>' +
    '<div class="mt-3 flex flex-wrap justify-center gap-2">' +
      '<button type="button" class="ba-button ba-button--secondary" disabled title="没有可用 Daemon">创建智能体不可用</button>' +
      '<a class="ba-button ba-button--primary" href="/settings/tokens/">检查令牌设置</a>' +
    '</div></div>';
}

function renderAgentEmpty(title, body, showCreate) {
  document.getElementById('agent-surface').innerHTML = '<div class="ba-empty-state">' +
    '<div class="ba-empty-state-icon">🤖</div>' +
    '<div class="ba-empty-state-title">' + escapeHtml(title) + '</div>' +
    '<div class="ba-empty-state-body">' + escapeHtml(body) + '</div>' +
    '<div class="mt-3 flex flex-wrap justify-center gap-2">' +
      (showCreate ? '<button type="button" class="ba-button ba-button--primary" onclick="openAgentForm()" data-ba-dialog-open>创建智能体</button>' : '') +
      '<a class="ba-button ba-button--secondary" href="/settings/tokens/">检查令牌设置</a>' +
    '</div></div>';
}

function openAgentForm(agentId) {
  var form = document.getElementById('agent-form');
  agentLastDialogTrigger = document.activeElement;
  form.reset();
  form.custom_env.value = '{}';
  form.custom_args.value = '{}';
  form.mcp_config.value = '{}';
  document.getElementById('agent-form-error').classList.add('hidden');
  document.getElementById('agent_id').value = '';
  document.getElementById('agent-dialog-title').textContent = '创建智能体';
  document.getElementById('agent-submit-button').textContent = '创建';
  var agent = agentState.agents.find(function(item) { return item.id === agentId; });
  if (agent) {
    document.getElementById('agent_id').value = agent.id;
    document.getElementById('agent-dialog-title').textContent = '编辑智能体';
    document.getElementById('agent-submit-button').textContent = '保存';
    form.name.value = agent.name || '';
    form.description.value = agent.description || '';
    form.daemon_id.value = agent.daemon_id || '';
    form.provider.value = agent.provider || 'claude';
    form.model.value = agent.model || '';
    form.instructions.value = agent.instructions || '';
    form.max_concurrent_tasks.value = agent.max_concurrent_tasks || 3;
    form.custom_env.value = JSON.stringify(agent.custom_env || {}, null, 2);
    form.custom_args.value = JSON.stringify(agent.custom_args || {}, null, 2);
    form.mcp_config.value = JSON.stringify(agent.mcp_config || {}, null, 2);
  }
  var dialog = document.getElementById('agent-dialog');
  dialog.hidden = false;
  dialog.classList.remove('hidden');
  window.setTimeout(function() { form.name.focus(); }, 0);
}

function closeAgentDialog() {
  var dialog = document.getElementById('agent-dialog');
  if (!dialog || dialog.hidden) return;
  dialog.hidden = true;
  dialog.classList.add('hidden');
  if (agentLastDialogTrigger && typeof agentLastDialogTrigger.focus === 'function') agentLastDialogTrigger.focus({preventScroll: true});
}

async function submitAgentForm(event) {
  event.preventDefault();
  var form = event.currentTarget;
  var agentId = form.agent_id.value;
  var errorBox = document.getElementById('agent-form-error');
  errorBox.classList.add('hidden');
  try {
    if (!form.name.value.trim()) throw new Error('请输入智能体名称。');
    if (!form.daemon_id.value) throw new Error('请选择 Daemon。');
    var payload = {
      name: form.name.value.trim(),
      description: form.description.value.trim(),
      daemon_id: form.daemon_id.value,
      provider: form.provider.value,
      model: form.model.value.trim(),
      instructions: form.instructions.value.trim(),
      max_concurrent_tasks: Number(form.max_concurrent_tasks.value || 3),
      custom_env: parseJsonField(form.custom_env.value, '环境变量 JSON'),
      custom_args: parseJsonField(form.custom_args.value, '启动参数 JSON'),
      mcp_config: parseJsonField(form.mcp_config.value, 'MCP 配置 JSON')
    };
    await apiJson(agentId ? '/api/agents/' + agentId : '/api/agents', {
      method: agentId ? 'PATCH' : 'POST',
      headers: agentHeaders(),
      body: JSON.stringify(payload)
    });
    closeAgentDialog();
    showAgentAlert(agentId ? '智能体已更新。' : '智能体已创建。', 'success');
    await loadAgentDependencies();
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('hidden');
  }
}

async function toggleAgentArchive(agentId) {
  var agent = agentState.agents.find(function(item) { return item.id === agentId; });
  if (!agent) return;
  var action = agent.status === 'archived' ? 'restore' : 'archive';
  try {
    await apiJson('/api/agents/' + agentId + '/' + action, {method: 'POST', headers: agentHeaders()});
    showAgentAlert(action === 'archive' ? '智能体已归档。' : '智能体已恢复。', 'success');
    await loadAgentDependencies();
  } catch (error) {
    showAgentAlert(error.message, 'error');
  }
}

async function cancelAgentTasks(agentId) {
  var agent = agentState.agents.find(function(item) { return item.id === agentId; });
  if (!agent) return;
  if (!confirm('取消智能体“' + (agent.name || '未命名智能体') + '”的正在运行任务？')) return;
  try {
    var result = await apiJson('/api/agents/' + agentId + '/cancel-tasks', {method: 'POST', headers: agentHeaders()});
    showAgentAlert('已取消 ' + (result.cancelled || 0) + ' 个任务。', 'success');
    await loadAgentDependencies();
  } catch (error) {
    showAgentAlert(error.message, 'error');
  }
}

async function copyAgentConfig(agentId) {
  var agent = agentState.agents.find(function(item) { return item.id === agentId; });
  if (!agent) return;
  var config = {
    name: agent.name,
    provider: agent.provider,
    model: agent.model,
    instructions: agent.instructions,
    max_concurrent_tasks: agent.max_concurrent_tasks,
    custom_env: agent.custom_env || {},
    custom_args: agent.custom_args || {},
    mcp_config: agent.mcp_config || {}
  };
  try {
    await navigator.clipboard.writeText(JSON.stringify(config, null, 2));
    showAgentAlert('已复制智能体配置。', 'success');
  } catch (error) {
    showAgentAlert('复制失败，请手动复制：' + JSON.stringify(config), 'error');
  }
}

async function deleteAgent(agentId) {
  var agent = agentState.agents.find(function(item) { return item.id === agentId; });
  var name = agent ? (agent.name || '未命名智能体') : '该智能体';
  if (!confirm('确定删除智能体“' + name + '”吗？相关任务记录可能无法继续关联。')) return;
  try {
    await apiJson('/api/agents/' + agentId, {method: 'DELETE', headers: agentHeaders()});
    showAgentAlert('智能体已删除。', 'success');
    await loadAgentDependencies();
  } catch (error) {
    showAgentAlert(error.message, 'error');
  }
}

function resetAgentFilters() {
  agentState.filters = { search: '', status: 'active', sort: 'updated_desc' };
  document.getElementById('agent-search').value = '';
  document.getElementById('agent-status-filter').value = 'active';
  document.getElementById('agent-sort').value = 'updated_desc';
  renderAgents();
}

function findDaemon(daemonId) {
  return agentState.daemons.find(function(daemon) { return String(daemon.id) === String(daemonId); });
}

function updateAgentCount(visible, total) {
  document.getElementById('agent-count').textContent = visible + ' / ' + total + ' 个智能体';
}

function showAgentAlert(message, type) {
  var alert = document.getElementById('agent-alert');
  alert.className = 'ba-alert mb-4 ba-alert--' + (type === 'error' ? 'error' : 'success');
  alert.textContent = message;
  alert.classList.remove('hidden');
}

function hideAgentAlert() {
  document.getElementById('agent-alert').classList.add('hidden');
}

function statusBadge(value) {
  if (value === 'active') return '<span class="ba-badge ba-badge--success">活跃</span>';
  if (value === 'archived') return '<span class="ba-badge ba-badge--neutral">已归档</span>';
  return '<span class="ba-badge ba-badge--info">' + escapeHtml(value || '未知') + '</span>';
}

function normalizeList(data) { return Array.isArray(data) ? data : (Array.isArray(data.results) ? data.results : []); }
function parseJsonField(value, label) { try { return value.trim() ? JSON.parse(value) : {}; } catch (error) { throw new Error(label + ' 格式不正确，弹窗已保留当前输入。'); } }
function escapeHtml(str) { var div = document.createElement('div'); div.textContent = String(str == null ? '' : str); return div.innerHTML; }
function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }
function escapeJs(str) { return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function formatDate(iso) { if (!iso) return '—'; var d = new Date(iso); return Number.isNaN(d.getTime()) ? '—' : d.toLocaleDateString('zh-CN', {year:'numeric', month:'short', day:'numeric'}); }
function formatApiError(data) { if (data.detail) return data.detail; if (typeof data === 'string') return data; return Object.keys(data || {}).map(function(key) { return key + ': ' + (Array.isArray(data[key]) ? data[key].join('，') : JSON.stringify(data[key])); }).join('；') || '请求失败'; }
