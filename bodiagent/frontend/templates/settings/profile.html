{% extends "base.html" %}
{% block title %}设置 - 波笛智能体{% endblock %}

{% block content %}
<div data-workspace-id="{{ current_workspace_id|default:'' }}" data-csrf="{{ csrf_token }}">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">个人设置</h1>

  <div class="mb-6">
    <a href="/settings/tokens/" class="inline-flex items-center rounded-md border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50" hx-boost="true">
      管理 CLI Token
    </a>
  </div>

  <!-- Profile -->
  <div class="rounded-lg border border-gray-200 bg-white shadow-sm mb-6">
    <div class="border-b border-gray-100 px-6 py-4">
      <h2 class="text-sm font-semibold text-gray-900">个人信息</h2>
    </div>
    <form hx-patch="/api/me/"
          hx-target="#profile-msg"
          hx-swap="innerHTML"
          class="px-6 py-4 space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
        <input type="text" name="name" value="{{ request.user.name }}"
               class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
        <input type="email" name="email" value="{{ request.user.email }}"
               class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">头像 URL</label>
        <input type="url" name="avatar_url" value="{{ request.user.avatar_url|default:'' }}"
               class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 focus:outline-none"
               placeholder="https://...">
      </div>
      <div id="profile-msg"></div>
      <div class="flex justify-end">
        <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
          保存
        </button>
      </div>
    </form>
  </div>

  <!-- Preferences -->
  <div class="rounded-lg border border-gray-200 bg-white shadow-sm mb-6">
    <div class="border-b border-gray-100 px-6 py-4">
      <h2 class="text-sm font-semibold text-gray-900">偏好设置</h2>
    </div>
    <div class="px-6 py-4 space-y-4" x-data="{ theme: localStorage.getItem('theme') || 'system' }">
      <!-- Language -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">语言</label>
        <select class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 focus:outline-none">
          <option value="zh-hans">简体中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- Theme -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">主题</label>
        <div class="flex gap-2">
          <button type="button"
                  class="rounded-lg border px-4 py-2 text-sm"
                  :class="theme === 'light' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-700'"
                  @click="theme = 'light'; localStorage.setItem('theme', 'light'); applyTheme('light')">
            浅色
          </button>
          <button type="button"
                  class="rounded-lg border px-4 py-2 text-sm"
                  :class="theme === 'dark' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-700'"
                  @click="theme = 'dark'; localStorage.setItem('theme', 'dark'); applyTheme('dark')">
            深色
          </button>
          <button type="button"
                  class="rounded-lg border px-4 py-2 text-sm"
                  :class="theme === 'system' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-700'"
                  @click="theme = 'system'; localStorage.setItem('theme', 'system'); applyTheme('system')">
            跟随系统
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Preferences -->
  <div class="rounded-lg border border-gray-200 bg-white shadow-sm">
    <div class="border-b border-gray-100 px-6 py-4">
      <h2 class="text-sm font-semibold text-gray-900">通知偏好</h2>
    </div>
    <div class="px-6 py-4 space-y-3">
      {% with prefs=request.user.notification_preferences.first %}
      <label class="flex items-center gap-3">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               {% if not prefs or prefs.assignments %}checked{% endif %}>
        <span class="text-sm text-gray-700">Issue 分配通知</span>
      </label>
      <label class="flex items-center gap-3">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               {% if not prefs or prefs.statuses %}checked{% endif %}>
        <span class="text-sm text-gray-700">状态变更通知</span>
      </label>
      <label class="flex items-center gap-3">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               {% if not prefs or prefs.comments %}checked{% endif %}>
        <span class="text-sm text-gray-700">评论通知</span>
      </label>
      <label class="flex items-center gap-3">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               {% if not prefs or prefs.updates %}checked{% endif %}>
        <span class="text-sm text-gray-700">Issue 更新通知</span>
      </label>
      <label class="flex items-center gap-3">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               {% if not prefs or prefs.agent_activity %}checked{% endif %}>
        <span class="text-sm text-gray-700">智能体活动通知</span>
      </label>
      {% endwith %}
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.classList.add('dark');
  } else if (theme === 'light') {
    document.documentElement.classList.remove('dark');
  } else {
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }
}

// Apply saved theme on load
(function() {
  var theme = localStorage.getItem('theme') || 'system';
  applyTheme(theme);
})();
</script>
{% endblock %}
