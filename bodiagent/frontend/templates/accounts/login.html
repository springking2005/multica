{% extends "base_guest.html" %}
{% block title %}登录 - 波笛智能体{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-center mb-2">登录</h1>
    <p class="text-gray-500 text-center mb-8">欢迎回到波笛智能体</p>
    <form id="login-form" method="post" action="/api/auth/login" hx-post="/api/auth/login" hx-target="#error" hx-swap="innerHTML" class="space-y-4">
        {% csrf_token %}
        <input type="email" name="email" placeholder="邮箱地址" required class="w-full px-4 py-3 border rounded-lg">
        <input type="password" name="password" placeholder="密码" required class="w-full px-4 py-3 border rounded-lg">
        <div id="error" class="text-red-500 text-sm" role="alert" aria-live="polite"></div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700">登录</button>
    </form>
    <p class="text-center mt-4 text-sm text-gray-500">还没有账号？<a href="/register" class="text-blue-600">注册</a></p>
</div>
<script>
function handleLoginResponse(data) {
    if (!data || !data.token) return false;
    localStorage.setItem('bodiagent_token', data.token);
    localStorage.setItem('bodiagent_refresh', data.refresh);
    window.location.href = '/dashboard/';
    return true;
}

function parseLoginJson(responseText) {
    if (!responseText) return null;
    try {
        return JSON.parse(responseText);
    } catch(e) {
        return null;
    }
}

function extractLoginError(data) {
    var fallback = '登录失败，请检查邮箱和密码';
    if (!data) return fallback;
    if (typeof data === 'string') return data;
    var keys = ['detail', 'error', 'non_field_errors', 'email', 'password'];
    for (var i = 0; i < keys.length; i += 1) {
        var value = data[keys[i]];
        if (!value) continue;
        if (Array.isArray(value)) return value.join(' ');
        if (typeof value === 'string') return value;
    }
    for (var key in data) {
        if (!Object.prototype.hasOwnProperty.call(data, key)) continue;
        var nested = data[key];
        if (Array.isArray(nested) && nested.length) return nested.join(' ');
        if (typeof nested === 'string' && nested) return nested;
    }
    return fallback;
}

function showLoginError(message) {
    document.getElementById('error').textContent = message || '登录失败，请检查邮箱和密码';
}

function clearLoginError() {
    document.getElementById('error').textContent = '';
}

function isLoginFormRequest(evt) {
    var detail = evt.detail || {};
    var requestElt = detail.requestConfig && detail.requestConfig.elt;
    return Boolean(
        (detail.elt && detail.elt.id === 'login-form') ||
        (requestElt && requestElt.id === 'login-form')
    );
}

document.body.addEventListener('htmx:beforeRequest', function(evt) {
    if (!isLoginFormRequest(evt)) return;
    clearLoginError();
});

document.body.addEventListener('htmx:beforeSwap', function(evt) {
    if (!isLoginFormRequest(evt)) return;
    if (evt.detail.xhr.status >= 400) {
        evt.detail.shouldSwap = false;
        evt.detail.isError = false;
    }
});

document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (!isLoginFormRequest(evt)) return;
    var data = parseLoginJson(evt.detail.xhr.responseText);
    if (evt.detail.xhr.status >= 200 && evt.detail.xhr.status < 300) {
        if (!handleLoginResponse(data)) showLoginError('登录响应无效');
        return;
    }
    showLoginError(extractLoginError(data));
});

document.getElementById('login-form').addEventListener('submit', function(evt) {
    if (window.htmx) return;
    evt.preventDefault();
    clearLoginError();
    var form = evt.currentTarget;
    var csrf = form.querySelector('input[name="csrfmiddlewaretoken"]').value;
    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        credentials: 'same-origin',
        headers: { 'X-CSRFToken': csrf }
    })
        .then(function(response) {
            return response.text().then(function(text) {
                var data = parseLoginJson(text);
                if (!response.ok) throw data;
                return data;
            });
        })
        .then(function(data) {
            if (!handleLoginResponse(data)) showLoginError('登录响应无效');
        })
        .catch(function(data) {
            showLoginError(extractLoginError(data));
        });
});
</script>
{% endblock %}
