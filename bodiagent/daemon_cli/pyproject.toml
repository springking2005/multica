[project]
name = "bodiagent-daemon"
version = "0.1.0"
description = "波笛智能体 Daemon CLI — local task execution agent"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "websockets>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
bodiagent-daemon = "cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "config*", "client*", "executor*", "git_ops*", "gc*", "identity*", "providers*"]
