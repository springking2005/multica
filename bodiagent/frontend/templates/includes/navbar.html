<header class="fixed top-0 left-0 right-0 z-30 border-b border-gray-200 bg-white/95 shadow-sm backdrop-blur"
        x-data="{ userMenuOpen: false, notifOpen: false }">
  <div class="flex h-14 items-center justify-between px-3 sm:px-5">
    <!-- Left: hamburger + logo -->
    <div class="flex items-center gap-3">
      <button type="button"
              class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-200 text-gray-700 md:hidden"
              @click="sidebarOpen = !sidebarOpen"
              aria-label="打开导航">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <a href="/" class="flex items-center gap-2" hx-boost="true">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-blue-600 text-sm font-semibold text-white">波</span>
        <span class="text-sm font-semibold text-gray-900">波笛智能体</span>
      </a>
    </div>

    <!-- Right: notifications + user menu -->
    <div class="flex items-center gap-2">
      <!-- Notification bell -->
      <div class="relative" @click.outside="notifOpen = false">
        <button type="button"
                class="relative inline-flex h-9 w-9 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-700"
                @click="window.BodiAgentUI && window.BodiAgentUI.rememberFocus(); notifOpen = !notifOpen"
                aria-label="通知">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute right-1 top-1 h-2 w-2 rounded-full bg-red-500"></span>
        </button>
        <!-- Dropdown -->
        <div class="absolute right-0 mt-1 w-72 rounded-lg border border-gray-200 bg-white shadow-lg"
             x-show="notifOpen"
             x-transition
             @click.outside="notifOpen = false"
             style="display: none;">
          <div class="border-b border-gray-100 px-4 py-3 text-sm font-medium text-gray-900">通知</div>
          <div class="max-h-64 overflow-y-auto px-4 py-3 text-sm text-gray-500">暂无新通知</div>
        </div>
      </div>

      <!-- User avatar / dropdown -->
      <div class="relative" @click.outside="userMenuOpen = false">
        <button type="button"
                class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-medium text-blue-700 hover:bg-blue-200"
                @click="window.BodiAgentUI && window.BodiAgentUI.rememberFocus(); userMenuOpen = !userMenuOpen"
                aria-label="用户菜单">
          {{ request.user.name|default:request.user.email|default:"U"|slice:":1"|upper }}
        </button>
        <!-- Dropdown -->
        <div class="absolute right-0 mt-1 w-48 rounded-lg border border-gray-200 bg-white shadow-lg"
             x-show="userMenuOpen"
             x-transition
             @click.outside="userMenuOpen = false"
             style="display: none;">
          <div class="border-b border-gray-100 px-4 py-3 text-sm text-gray-700">
            <p class="font-medium truncate">{{ request.user.email }}</p>
          </div>
          <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" hx-boost="true">⚙️ 设置</a>
          <form method="post" action="/api/auth/logout/">
            {% csrf_token %}
            <button type="submit" class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-50">退出登录</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
