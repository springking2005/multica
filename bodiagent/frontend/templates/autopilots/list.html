{% extends "base.html" %}
{% block title %}自动驾驶 - 波笛智能体{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto" id="autopilot-page" data-workspace-id="{{ current_workspace_id|default:'' }}" data-member-id="{{ current_member_id|default:'' }}" data-csrf="{{ csrf_token }}">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">自动驾驶</h1>
      <p class="mt-1 text-sm text-gray-500">管理定时、Webhook 和 API 触发的自动任务</p>
    </div>
    <button type="button" class="inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700" onclick="openAutopilotForm()">新建自动驾驶</button>
  </div>

  <div id="autopilot-alert" class="mb-4 hidden rounded-md border px-4 py-3 text-sm"></div>

  <section class="rounded-lg border border-gray-200 bg-white shadow-sm mb-6">
    <form id="autopilot-form" class="grid grid-cols-1 gap-4 p-4 sm:grid-cols-2">
      {% csrf_token %}
      <input type="hidden" name="autopilot_id">
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
        <input name="title" required class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400" placeholder="例如：每日巡检未处理 Issue">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
        <textarea name="description" rows="3" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">执行智能体</label>
        <select name="assignee" required class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400">
          <option value="">请选择智能体</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">执行模式</label>
        <select name="execution_mode" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400">
          <option value="create_issue">创建 Issue 并执行</option>
          <option value="run_only">仅执行</option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Issue 标题模板</label>
        <input name="issue_title_template" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400" placeholder="例如：自动巡检：{{ date }}">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">触发器类型</label>
        <select name="trigger_kind" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400">
          <option value="schedule">定时</option>
          <option value="webhook">Webhook</option>
          <option value="api">API</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">触发器标签</label>
        <input name="trigger_label" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400" placeholder="工作日巡检">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Cron 表达式</label>
        <input name="cron_expression" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400" placeholder="0 9 * * 1-5">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">时区</label>
        <input name="timezone" value="Asia/Shanghai" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" name="trigger_enabled" class="h-4 w-4 rounded border-gray-300 text-blue-600" checked>
        启用触发器
      </label>
      <div class="flex items-end justify-end gap-2">
        <button type="button" class="rounded-md border border-gray-200 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" onclick="openAutopilotForm()">清空</button>
        <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">保存</button>
      </div>
    </form>
  </section>

  <div id="autopilot-list" class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div class="rounded-lg border border-dashed border-gray-200 bg-white py-12 text-center text-sm text-gray-500">加载中...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var autopilotPage = document.getElementById('autopilot-page');
var autopilotWorkspaceId = autopilotPage ? autopilotPage.dataset.workspaceId : '';
var autopilotCsrf = autopilotPage ? autopilotPage.dataset.csrf : '';
var autopilotState = {autopilots: [], agents: []};

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('autopilot-form').addEventListener('submit', submitAutopilotForm);
  loadAutopilots();
});

function autopilotHeaders() {
  return {'Content-Type': 'application/json', 'X-CSRFToken': autopilotCsrf, 'X-Workspace-ID': autopilotWorkspaceId};
}

async function loadAutopilots() {
  if (!autopilotWorkspaceId) return renderAutopilotEmpty('当前用户还没有工作区，无法加载自动驾驶。');
  try {
    var results = await Promise.all([
      apiJson('/api/autopilots', {headers: autopilotHeaders()}),
      apiJson('/api/agents', {headers: autopilotHeaders()})
    ]);
    autopilotState.autopilots = normalizeList(results[0]);
    autopilotState.agents = normalizeList(results[1]);
    renderAgentOptions();
    renderAutopilots();
  } catch (error) {
    renderAutopilotEmpty('加载失败：' + error.message);
  }
}

function renderAgentOptions() {
  var select = document.querySelector('#autopilot-form [name="assignee"]');
  select.innerHTML = '<option value="">请选择智能体</option>' + autopilotState.agents.map(function(agent) {
    return '<option value="' + escapeHtml(agent.id) + '">' + escapeHtml(agent.name || agent.provider || agent.id) + '</option>';
  }).join('');
}

function renderAutopilots() {
  var list = document.getElementById('autopilot-list');
  if (!autopilotState.autopilots.length) return renderAutopilotEmpty('暂无自动驾驶，填写上方表单创建第一个。');
  list.innerHTML = autopilotState.autopilots.map(function(item) {
    var trigger = (item.triggers || [])[0] || {};
    var statusClass = item.status === 'active' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-600';
    return '<article class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">' +
      '<div class="flex items-start justify-between gap-3">' +
        '<div class="min-w-0"><h2 class="truncate text-base font-semibold text-gray-900">' + escapeHtml(item.title) + '</h2>' +
        '<p class="mt-1 text-xs text-gray-500">' + modeLabel(item.execution_mode) + '</p></div>' +
        '<span class="rounded-full px-2 py-1 text-xs font-medium ' + statusClass + '">' + statusLabel(item.status) + '</span>' +
      '</div>' +
      '<p class="mt-3 min-h-[3rem] text-sm text-gray-600">' + escapeHtml(item.description || '无描述') + '</p>' +
      '<div class="mt-3 rounded-md bg-gray-50 p-3 text-xs text-gray-600">' +
        '<div>触发器：' + triggerKindLabel(trigger.kind) + (trigger.label ? ' / ' + escapeHtml(trigger.label) : '') + '</div>' +
        '<div class="mt-1">Cron：' + escapeHtml(trigger.cron_expression || '-') + '</div>' +
      '</div>' +
      '<div class="mt-4 flex flex-wrap justify-end gap-2 border-t border-gray-100 pt-4">' +
        '<button type="button" class="rounded-md border border-gray-200 px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50" onclick="openAutopilotForm(\'' + item.id + '\')">编辑</button>' +
        '<button type="button" class="rounded-md border border-gray-200 px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50" onclick="toggleAutopilot(\'' + item.id + '\')">' + (item.status === 'active' ? '暂停' : '启用') + '</button>' +
        '<button type="button" class="rounded-md border border-red-200 px-3 py-1.5 text-xs text-red-700 hover:bg-red-50" onclick="deleteAutopilot(\'' + item.id + '\')">删除</button>' +
      '</div>' +
    '</article>';
  }).join('');
}

function renderAutopilotEmpty(message) {
  document.getElementById('autopilot-list').innerHTML =
    '<div class="lg:col-span-2 rounded-lg border border-dashed border-gray-200 bg-white py-12 text-center text-sm text-gray-500">' + escapeHtml(message) + '</div>';
}

function openAutopilotForm(itemId) {
  var form = document.getElementById('autopilot-form');
  form.reset();
  form.autopilot_id.value = '';
  form.execution_mode.value = 'create_issue';
  form.trigger_kind.value = 'schedule';
  form.timezone.value = 'Asia/Shanghai';
  form.trigger_enabled.checked = true;
  var item = autopilotState.autopilots.find(function(row) { return row.id === itemId; });
  if (item) {
    var trigger = (item.triggers || [])[0] || {};
    form.autopilot_id.value = item.id;
    form.title.value = item.title || '';
    form.description.value = item.description || '';
    form.assignee.value = item.assignee || '';
    form.execution_mode.value = item.execution_mode || 'create_issue';
    form.issue_title_template.value = item.issue_title_template || '';
    form.trigger_kind.value = trigger.kind || 'schedule';
    form.trigger_label.value = trigger.label || '';
    form.cron_expression.value = trigger.cron_expression || '';
    form.timezone.value = trigger.timezone || 'Asia/Shanghai';
    form.trigger_enabled.checked = trigger.enabled !== false;
  }
  form.title.focus();
}

async function submitAutopilotForm(event) {
  event.preventDefault();
  var form = event.currentTarget;
  var autopilotId = form.autopilot_id.value;
  var payload = {
    title: form.title.value.trim(),
    description: form.description.value.trim(),
    assignee: form.assignee.value,
    execution_mode: form.execution_mode.value,
    issue_title_template: form.issue_title_template.value.trim()
  };
  try {
    var saved = await apiJson(autopilotId ? '/api/autopilots/' + autopilotId : '/api/autopilots', {
      method: autopilotId ? 'PATCH' : 'POST',
      headers: autopilotHeaders(),
      body: JSON.stringify(payload)
    });
    await saveAutopilotTrigger(saved.id || autopilotId, form);
    showAutopilotAlert(autopilotId ? '自动驾驶已更新。' : '自动驾驶已创建。', 'success');
    openAutopilotForm();
    await loadAutopilots();
  } catch (error) {
    showAutopilotAlert(error.message, 'error');
  }
}

async function saveAutopilotTrigger(autopilotId, form) {
  var item = autopilotState.autopilots.find(function(row) { return row.id === autopilotId; });
  var trigger = item && (item.triggers || [])[0];
  var payload = {
    kind: form.trigger_kind.value,
    label: form.trigger_label.value.trim(),
    enabled: form.trigger_enabled.checked,
    cron_expression: form.cron_expression.value.trim(),
    timezone: form.timezone.value.trim() || 'Asia/Shanghai'
  };
  await apiJson(trigger ? '/api/autopilots/' + autopilotId + '/triggers/' + trigger.id : '/api/autopilots/' + autopilotId + '/triggers', {
    method: trigger ? 'PATCH' : 'POST',
    headers: autopilotHeaders(),
    body: JSON.stringify(payload)
  });
}

async function toggleAutopilot(itemId) {
  var item = autopilotState.autopilots.find(function(row) { return row.id === itemId; });
  if (!item) return;
  try {
    await apiJson('/api/autopilots/' + itemId + '/' + (item.status === 'active' ? 'disable' : 'enable') + '/', {method: 'POST', headers: autopilotHeaders()});
    await loadAutopilots();
  } catch (error) {
    showAutopilotAlert(error.message, 'error');
  }
}

async function deleteAutopilot(itemId) {
  if (!confirm('确定删除这个自动驾驶吗？')) return;
  try {
    await apiJson('/api/autopilots/' + itemId, {method: 'DELETE', headers: autopilotHeaders()});
    showAutopilotAlert('自动驾驶已删除。', 'success');
    await loadAutopilots();
  } catch (error) {
    showAutopilotAlert(error.message, 'error');
  }
}

function showAutopilotAlert(message, type) {
  var alert = document.getElementById('autopilot-alert');
  alert.className = 'mb-4 rounded-md border px-4 py-3 text-sm ' +
    (type === 'error' ? 'border-red-200 bg-red-50 text-red-700' : 'border-green-200 bg-green-50 text-green-700');
  alert.textContent = message;
  alert.classList.remove('hidden');
}

function normalizeList(data) { return Array.isArray(data) ? data : (Array.isArray(data.results) ? data.results : []); }
function escapeHtml(str) { var div = document.createElement('div'); div.textContent = String(str == null ? '' : str); return div.innerHTML; }
function statusLabel(value) { return ({active:'启用', paused:'暂停'})[value] || value || '暂停'; }
function modeLabel(value) { return ({create_issue:'创建 Issue 并执行', run_only:'仅执行'})[value] || value || '创建 Issue 并执行'; }
function triggerKindLabel(value) { return ({schedule:'定时', webhook:'Webhook', api:'API'})[value] || value || '-'; }
async function apiJson(url, options) { var response = await fetch(url, options || {}); var text = await response.text(); var data = text ? JSON.parse(text) : {}; if (!response.ok) throw new Error(formatApiError(data)); return data; }
function formatApiError(data) { if (data.detail) return data.detail; return Object.keys(data || {}).map(function(key) { return key + ': ' + (Array.isArray(data[key]) ? data[key].join('，') : JSON.stringify(data[key])); }).join('；') || '请求失败'; }
</script>
{% endblock %}
