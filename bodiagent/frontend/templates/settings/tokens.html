{% extends "base.html" %}
{% block title %}Token - 波笛智能体{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto" id="token-page" data-workspace-id="{{ current_workspace_id|default:'' }}" data-csrf="{{ csrf_token }}">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">CLI Token</h1>
      <p class="mt-1 text-sm text-gray-500">创建和撤销用于 daemon CLI 的访问 Token</p>
    </div>
  </div>

  <div id="token-alert" class="mb-4 hidden rounded-md border px-4 py-3 text-sm"></div>

  <section class="rounded-lg border border-gray-200 bg-white shadow-sm mb-6">
    <div class="border-b border-gray-100 px-4 py-3">
      <h2 class="text-sm font-semibold text-gray-900">创建 Token</h2>
    </div>
    <form id="token-form" class="grid grid-cols-1 gap-4 p-4 sm:grid-cols-[1fr_auto] sm:items-end">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
        <input name="name" value="CLI token" required class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400">
      </div>
      <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">生成 Token</button>
    </form>
    <div id="token-raw" class="hidden border-t border-yellow-100 bg-yellow-50 p-4">
      <p class="text-sm font-medium text-yellow-900">请立即复制，离开页面后不会再次显示。</p>
      <code class="mt-2 block overflow-x-auto rounded-md bg-white px-3 py-2 text-xs text-gray-900"></code>
    </div>
  </section>

  <section class="rounded-lg border border-gray-200 bg-white shadow-sm">
    <div class="border-b border-gray-100 px-4 py-3">
      <h2 class="text-sm font-semibold text-gray-900">当前 Token</h2>
    </div>
    <div id="token-list" class="divide-y divide-gray-100">
      <div class="px-4 py-8 text-center text-sm text-gray-500">加载中...</div>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
var tokenPage = document.getElementById('token-page');
var tokenCsrf = tokenPage ? tokenPage.dataset.csrf : '';
var tokenState = [];

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('token-form').addEventListener('submit', submitTokenForm);
  loadTokens();
});

function tokenHeaders() {
  return {'Content-Type': 'application/json', 'X-CSRFToken': tokenCsrf};
}

async function loadTokens() {
  try {
    tokenState = normalizeList(await apiJson('/api/tokens/', {headers: tokenHeaders()}));
    renderTokens();
  } catch (error) {
    renderTokenEmpty('加载失败：' + error.message);
  }
}

function renderTokens() {
  var list = document.getElementById('token-list');
  if (!tokenState.length) return renderTokenEmpty('暂无 Token。');
  list.innerHTML = tokenState.map(function(token) {
    return '<div class="flex flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">' +
      '<div class="min-w-0">' +
        '<p class="truncate text-sm font-medium text-gray-900">' + escapeHtml(token.name || 'Token') + '</p>' +
        '<p class="mt-1 text-xs text-gray-500">前缀：' + escapeHtml(token.token_prefix || '-') + ' / 创建：' + formatDate(token.created_at) + '</p>' +
      '</div>' +
      '<button type="button" class="self-start rounded-md border border-red-200 px-3 py-1.5 text-xs text-red-700 hover:bg-red-50 sm:self-auto" onclick="deleteToken(\'' + token.id + '\')">撤销</button>' +
    '</div>';
  }).join('');
}

function renderTokenEmpty(message) {
  document.getElementById('token-list').innerHTML = '<div class="px-4 py-8 text-center text-sm text-gray-500">' + escapeHtml(message) + '</div>';
}

async function submitTokenForm(event) {
  event.preventDefault();
  var form = event.currentTarget;
  try {
    var data = await apiJson('/api/tokens/cli-token/', {
      method: 'POST',
      headers: tokenHeaders(),
      body: JSON.stringify({})
    });
    showRawToken(data.token || data.raw || '');
    showTokenAlert('Token 已生成。', 'success');
    await loadTokens();
  } catch (error) {
    showTokenAlert(error.message, 'error');
  }
}

async function deleteToken(tokenId) {
  if (!confirm('确定撤销这个 Token 吗？正在使用它的 CLI 将无法继续访问。')) return;
  try {
    await apiJson('/api/tokens/' + tokenId + '/', {method: 'DELETE', headers: tokenHeaders()});
    showTokenAlert('Token 已撤销。', 'success');
    await loadTokens();
  } catch (error) {
    showTokenAlert(error.message, 'error');
  }
}

function showRawToken(raw) {
  var box = document.getElementById('token-raw');
  box.querySelector('code').textContent = raw;
  box.classList.remove('hidden');
}

function showTokenAlert(message, type) {
  var alert = document.getElementById('token-alert');
  alert.className = 'mb-4 rounded-md border px-4 py-3 text-sm ' +
    (type === 'error' ? 'border-red-200 bg-red-50 text-red-700' : 'border-green-200 bg-green-50 text-green-700');
  alert.textContent = message;
  alert.classList.remove('hidden');
}

function normalizeList(data) { return Array.isArray(data) ? data : (Array.isArray(data.results) ? data.results : []); }
function escapeHtml(str) { var div = document.createElement('div'); div.textContent = String(str == null ? '' : str); return div.innerHTML; }
function formatDate(iso) { if (!iso) return '-'; return new Date(iso).toLocaleDateString('zh-CN', {year:'numeric', month:'short', day:'numeric'}); }
async function apiJson(url, options) { var response = await fetch(url, options || {}); var text = await response.text(); var data = text ? JSON.parse(text) : {}; if (!response.ok) throw new Error(formatApiError(data)); return data; }
function formatApiError(data) { if (data.detail) return data.detail; return Object.keys(data || {}).map(function(key) { return key + ': ' + (Array.isArray(data[key]) ? data[key].join('，') : JSON.stringify(data[key])); }).join('；') || '请求失败'; }
</script>
{% endblock %}
