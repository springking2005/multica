<!-- Sidebar -->
<aside class="fixed top-14 bottom-0 left-0 z-40 w-64 border-r border-gray-200 bg-white md:translate-x-0"
       :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
       x-transition:enter="transition-transform duration-300 ease-out"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition-transform duration-200 ease-in"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       x-cloak>
  <div class="flex h-full flex-col px-3 py-3">
    <!-- Workspace switcher -->
    <div class="mb-3 rounded-lg bg-gray-50 px-2 py-2">
      <label for="workspace-switcher" class="text-xs font-medium uppercase tracking-wide text-gray-400">当前工作区</label>
      {% if workspaces %}
        <form method="get" action="{{ request.path }}" class="mt-1">
          <select id="workspace-switcher"
                  name="workspace_id"
                  class="w-full rounded-md border border-gray-200 bg-white px-2 py-1 text-sm font-semibold text-gray-900"
                  onchange="this.form.submit()"
                  aria-label="切换工作区">
            {% for workspace in workspaces %}
              <option value="{{ workspace.id }}" {% if current_workspace and workspace.id == current_workspace.id %}selected{% endif %}>
                {{ workspace.name }}
              </option>
            {% endfor %}
          </select>
        </form>
      {% else %}
        <p class="mt-1 text-sm font-semibold text-gray-900 truncate">我的工作区</p>
      {% endif %}
    </div>

    <!-- Navigation items -->
    <nav class="flex-1 space-y-0.5" aria-label="侧边栏导航">
      <a href="/inbox" class="sidebar-link {% if request.path == '/inbox' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">📥</span> 收件箱
        <span id="sidebar-inbox-count" class="ml-auto rounded-full bg-blue-100 px-2 py-0.5 text-xs font-semibold text-blue-700" data-unread-count>0</span>
      </a>
      <a href="/my-issues" class="sidebar-link {% if request.path == '/my-issues' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">📋</span> 我的 Issues
      </a>
      <a href="/issues" class="sidebar-link {% if request.path == '/issues' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">📊</span> 看板
      </a>
      <a href="/projects" class="sidebar-link {% if request.path == '/projects' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">📁</span> 项目
      </a>
      <a href="/chat" class="sidebar-link {% if request.path == '/chat' or request.path|slice:':6' == '/chat/' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">💬</span> 聊天
      </a>
      <a href="/autopilots" class="sidebar-link {% if request.path == '/autopilots' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">⚡</span> 自动驾驶
      </a>
      <a href="/agents" class="sidebar-link {% if request.path == '/agents' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">🤖</span> 智能体
      </a>
      <a href="/settings" class="sidebar-link {% if request.path == '/settings' %}bg-blue-100 text-blue-700{% endif %}" hx-boost="true">
        <span class="mr-3 text-lg">⚙️</span> 设置
      </a>
    </nav>
  </div>
</aside>
<script>
(function() {
  function updateSidebarInboxCount() {
    var badge = document.getElementById('sidebar-inbox-count');
    var workspaceId = '{{ current_workspace_id|default:"" }}';
    if (!badge || !workspaceId) return;
    fetch('/api/inbox/unread-count', {headers: {'Accept': 'application/json', 'X-Workspace-ID': workspaceId}, credentials: 'same-origin'})
      .then(function(response) { return response.ok ? response.json() : {count: 0}; })
      .then(function(data) { badge.textContent = String(data.count || 0); })
      .catch(function() { badge.textContent = '0'; });
  }
  document.addEventListener('DOMContentLoaded', updateSidebarInboxCount);
  window.addEventListener('bodiagent:inbox-updated', updateSidebarInboxCount);
})();
</script>
