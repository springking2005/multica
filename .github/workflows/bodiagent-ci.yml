# BodiAgent CI — runs on every push/PR to bodiagent-main
name: BodiAgent CI

on:
  push:
    branches: [bodiagent-main]
    paths: [bodiagent/**]
  pull_request:
    branches: [bodiagent-main]
    paths: [bodiagent/**]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bodiagent
          POSTGRES_USER: bodiagent
          POSTGRES_PASSWORD: bodiagent
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: cd bodiagent && pip install -e ".[dev]"

      - name: Lint
        run: cd bodiagent && ruff check .

      - name: Type check
        run: cd bodiagent && mypy .

      - name: Test
        run: cd bodiagent && pytest -n auto
        env:
          POSTGRES_HOST: localhost

      - name: Contract validation
        run: cd bodiagent && python scripts/validate_contracts.py
